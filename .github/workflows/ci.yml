name: Ambient AI Voice Scribe CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend API & Service Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install SpeechRecognition reportlab fhir.resources pytest pytest-asyncio

      - name: Run backend pytest test suite
        run: |
          cd backend
          pytest tests/ -v

  frontend-build:
    name: Frontend Compilation & Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: Build frontend production bundle
        run: |
          cd frontend
          npm run build

  mobile-extension-check:
    name: Validate Mobile Extension
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Mobile Assets
        run: |
          test -f mobile/index.html
          test -f mobile/app.js
          test -f mobile/style.css
          test -f mobile/manifest.json
          echo "Mobile extension files validated successfully."

