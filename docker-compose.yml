services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: voice_scribe_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=sqlite:///./app.db
      - AUDIO_STORAGE_DIR=/app/data/audio
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3
    volumes:
      - ./data/audio:/app/data/audio
      - ./backend/app:/app/app
      - backend_db:/app/data
    depends_on:
      - ollama

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: voice_scribe_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

  ollama:
    image: ollama/ollama:latest
    container_name: voice_scribe_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

volumes:
  backend_db:
  ollama_models:
